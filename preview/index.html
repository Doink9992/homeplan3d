<!doctype html><meta charset="utf-8"><title>Home Plan 3D – Vorschau</title>
<body style="margin:0;height:100vh;background:#000;overflow:hidden">
<script type="module" src="../custom_components/homeplan3d/www/homeplan3d.js"></script>
<script type="module">
// Demo harness without Home Assistant
const q = new URLSearchParams(location.search);
// ?plan=../import/plan.json loads your own plan; the default is a small demo house
let plan = { version: 2, floors: [] };
try { plan = await (await fetch(q.get("plan") || "demo-plan.json")).json(); } catch {}
let neon = null; // optional: ?neon=../import/neonplan-raw.json enables the NeonPlan 3D import button
if (q.get("neon")) try { neon = (await (await fetch(q.get("neon"))).json()).result; } catch {}
const dc = (device_class, unit) => ({ device_class, unit_of_measurement: unit });
const states = {
  "light.wohnzimmer": { state: "on", attributes: { friendly_name: "Wohnzimmer", brightness: 200, rgb_color: [255, 160, 60] } },
  "light.deckenlicht": { state: "off", attributes: { friendly_name: "Deckenlicht" } },
  "climate.heizung_wohnen": { state: "heat", attributes: { friendly_name: "Heizung Wohnen", current_temperature: 21.4 } },
  "switch.stehlampe": { state: "on", attributes: { friendly_name: "Stehlampe" } },
  "switch.steckdose_tv": { state: "on", attributes: { friendly_name: "Steckdose TV" } },
  "switch.kaffeemaschine": { state: "off", attributes: { friendly_name: "Kaffeemaschine" } },
  "binary_sensor.haustuer": { state: q.get("door") === "open" ? "on" : "off", attributes: {} },
  "weather.home": { state: q.get("weather") || "partlycloudy", attributes: { friendly_name: "Wetter", temperature: 12, wind_speed: Number(q.get("wind") || 22), wind_speed_unit: "km/h", wind_bearing: 270 } },
  "sun.sun": { state: q.get("night") ? "below_horizon" : "above_horizon", attributes: { elevation: q.get("night") ? -22 : 38, azimuth: 205 } },
  "media_player.tv": { state: "playing", attributes: { friendly_name: "TV", app_name: "Netflix", media_title: "Dark", entity_picture: "/preview/cover.svg", volume_level: 0.4, source: "HDMI 1", source_list: ["HDMI 1", "HDMI 2"] } },
  "media_player.wohnen_speaker": { state: "playing", attributes: { friendly_name: "Wohnen", media_title: "Neon Nights", media_artist: "Demo Band", entity_picture: "/preview/cover.svg", volume_level: 0.6, group_members: ["media_player.wohnen_speaker", "media_player.kueche"] } },
  "media_player.kueche": { state: "playing", attributes: { friendly_name: "Küche", media_title: "Neon Nights", media_artist: "Demo Band", entity_picture: "/preview/cover.svg", volume_level: 0.3, group_members: ["media_player.wohnen_speaker", "media_player.kueche"] } },
  "camera.hof": { state: "recording", attributes: { friendly_name: "Hof", entity_picture: "/preview/cam.svg" } },
  "sensor.pv_power": { state: "310", attributes: { unit_of_measurement: "W" } },
  "sensor.house_power": { state: "1240", attributes: { unit_of_measurement: "W" } },
  "sensor.wohnen_temperatur": { state: "21.4", attributes: dc("temperature", "°C") },
  "sensor.wohnen_feuchte": { state: "47", attributes: dc("humidity", "%") },
  "sensor.kueche_temperatur": { state: "23.9", attributes: dc("temperature", "°C") },
  "sensor.kueche_feuchte": { state: "58", attributes: dc("humidity", "%") },
  "sensor.schlafen_temperatur": { state: "17.6", attributes: dc("temperature", "°C") },
};
const inArea = (area, ...ids) => Object.fromEntries(ids.map((i) => [i, { area_id: area }]));
const hass = {
  states, user: { is_admin: true },
  areas: { wohnzimmer: { area_id: "wohnzimmer", name: "Wohnzimmer" }, kueche: { area_id: "kueche", name: "Küche" }, schlafen: { area_id: "schlafen", name: "Schlafzimmer" } },
  entities: {
    ...inArea("wohnzimmer", "light.wohnzimmer", "light.deckenlicht", "switch.stehlampe", "switch.steckdose_tv", "sensor.wohnen_temperatur", "sensor.wohnen_feuchte"),
    ...inArea("kueche", "switch.kaffeemaschine", "sensor.kueche_temperatur", "sensor.kueche_feuchte"),
    ...inArea("schlafen", "sensor.schlafen_temperatur"),
  },
  devices: {},
  callWS: async (m) => {
    if (m.type === "homeplan3d/get") return plan;
    if (m.type === "homeplan3d/save") { plan = m.plan; return { ok: true }; }
    if (m.type === "neonplan3d/building/get" && neon) return neon;
    if (m.type === "media_player/browse_media") {
      const folder = (t, id) => ({ title: t, media_content_id: id, media_content_type: "library", can_expand: true, can_play: false });
      if (!m.media_content_id) return { title: "Medien", media_content_id: "root", media_content_type: "library", children: [folder("Radiosender", "radio"), folder("Playlists", "lists")] };
      return { title: m.media_content_id === "radio" ? "Radiosender" : "Playlists", media_content_id: m.media_content_id, media_content_type: "library",
        children: [1, 2, 3].map((i) => ({ title: `Eintrag ${i}`, media_content_id: `item${i}`, media_content_type: "music", can_play: true, can_expand: false })) };
    }
    throw new Error("unknown " + m.type);
  },
  callService: (d, s, x) => { const e = states[x.entity_id]; if (e) e.state = e.state === "on" ? "off" : "on"; el.hass = { ...hass }; },
};
const el = document.createElement(q.get("card") ? "homeplan3d-card" : "homeplan3d-panel");
if (q.get("card")) el.setConfig({ type: "custom:homeplan3d-card", height: 600 });
document.body.append(el);
el.hass = hass;
window.el = el;
</script>
